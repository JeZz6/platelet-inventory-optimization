name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_reproduction:
        description: Run the full model search and compare with reference outputs
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the existing 40 tests
        run: python -m unittest discover -s tests -v
      - name: Audit supplied forecasts and simulator callbacks
        run: python verify_advanced.py --output-dir results
      - name: Reproduce complete experiment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_reproduction }}
        run: python run_project.py --output-dir ci_results
      - name: Compare reproduced numbers with supplied reference
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_reproduction }}
        run: python scripts/check_reproduction.py --output-dir ci_results

